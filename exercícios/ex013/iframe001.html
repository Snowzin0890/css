<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        iframe {
            border: 2px outset #000;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1> Testando o uso de um iframe</h1>
    <p>Este é um exemplo de iframe: <br>
        <iframe src="https://www.cursoemvideo.com" frameborder="0" width="100%" height="300px">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe>
    </p>
    
    <p>O repositório do Guanabara também é bem legal: <br>
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" width="100%" height="300px">
            no<a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
        </iframe>
    </p>
</body>
</html>
