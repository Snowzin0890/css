<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="#" method="post" autocomplete="on">
        <div>
            <label for="estado">Estado:</label>
            <select name="estado" id="estado">
                <option value="" selected>--- Escolha ---</option>
                <optgroup label="Região Sudeste">
                    <option value="MG" >Minas Gerais</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                </optgroup>
                <optgroup label="Região Nordeste">
                    <option value="BA">Bahia</option>
                    <option value="PE">Pernambuco</option>
                    <option value="CE">Ceará</option>
                </optgroup>
            </select>
        </div>
        <br>
        <div>
            <label for="profissao">Profissão:</label>
            <input type="text" name="profissao" id="profissao" list="lista-profissao" placeholder="Digite ou escolha">
            <datalist id="lista-profissao">
                <option value="Engenheiro"></option>
                <option value="Médico"></option>
                <option value="Professor"></option>
                <option value="Advogado"></option>
                <option value="Designer"></option>
            </datalist>
        </div>
        <br>
        <div>
            <label for="mensagem">Mensagem:</label>
            <br>
            <textarea name="mensagem" id="mensagem" cols="30" rows="5" maxlength="2000"></textarea>
        </div>
        <br>
        <div>
            <label for="arquivo">Enviar arquivo:</label>
            <input type="file" name="arquivo" id="arquivo" accept=".pdf, .doc, .docx, image/*">
        </div>
        <br>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
