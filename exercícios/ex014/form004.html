<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Esportes favoritos</legend>
            <label for="futebol"><input type="checkbox" name="esportes" value="futebol" id="futebol"> Futebol</label><br>
            <label for="basquete"><input type="checkbox" name="esportes" value="basquete" id="basquete"> Basquete</label><br>
            <label for="volei"><input type="checkbox" name="esportes" value="volei" id="volei"> Vôlei</label><br>
            <label for="tenis"><input type="checkbox" name="esportes" value="tenis" id="tenis"> Tênis</label><br>
            <label for="natação"><input type="checkbox" name="esportes" value="natação" id="natação"> Natação</label><br>
        </fieldset><br>
        
        <fieldset>
            <legend>Sexo</legend>
            <label for="masculino"><input type="radio" name="sexo" value="masculino" id="masculino"> Masculino</label><br>
            <label for="feminino"><input type="radio" name="sexo" value="feminino" id="feminino"> Feminino</label><br>
        </fieldset><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
